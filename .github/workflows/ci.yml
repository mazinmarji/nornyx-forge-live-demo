name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate_repository.py
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts

  demo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[demo,dev]'
      - run: nornyx check .nornyx/contracts/forge_control.nyx
      - run: nornyx check .nornyx/contracts/runtime_network.nyx
      - run: nornyx-forge demo --offline --strict-nornyx
      - run: FORGE_SMOKE_STRICT=true python scripts/smoke_http.py
      - run: python -m build
