name: ci
on:
  # Branch work is covered by the pull_request event. Listening to bare `push`
  # as well ran the entire workflow twice per commit on the same SHA, which was
  # merely wasteful until container-launch added a real image build to each —
  # then the duplicate runs contended for runners and one of the pair sat
  # unstarted for an hour before being cancelled. Every job still runs on every
  # commit; it runs once.
  push:
    branches: [main]
  pull_request:
  # Hosted runners occasionally drop a queued job, or strand a whole run in
  # `queued` that the API will neither advance nor let you cancel. Without a
  # manual trigger the only way to ask the question again is an empty commit,
  # which puts infrastructure noise into a history that is meant to read as a
  # record of assurance findings.
  workflow_dispatch:

# A superseded run is finished with. Without this, pushing twice in quick
# succession leaves the older run competing with the newer one for the same
# runners, and the answer it eventually gives is about code nobody is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# EVERY `run:` STEP GETS `bash -eo pipefail`.
#
# GitHub's IMPLICIT shell is `bash -e`, which does not set pipefail: in
# `pytest ... | tail -3` the step observes `tail`, so a failing pytest can leave
# a step green. That is not hypothetical here -- a commit in this repository was
# made over a red suite by exactly that pipeline, and the displayed output
# looked fine because the displayed output was never the measured exit state.
#
# Declaring `shell: bash` explicitly is what turns pipefail on.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The demo extra carries nornyx. Installing only [dev] left every
      # @needs_nornyx test skipping, so a green CI run proved 139 of 202 tests
      # and none of the governance tooling. The job reported success over the
      # controls it was supposed to be guarding.
      - run: python -m pip install -e '.[demo,dev]'
      - run: python scripts/validate_repository.py
      - name: Tests, with no unexpected skips
        run: python scripts/check_test_coverage.py
      - run: python -m compileall -q src scripts

  # A real build and a real launch on a host with a real Docker daemon. The
  # default suite skips this because building downloads packages, which BRD-004
  # forbids for the offline run — but `docker compose config` only parses YAML,
  # so skipping everywhere would leave BRD-005 asserted by nothing.
  container-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'

      - name: Build the image and start the application
        env:
          FORGE_DOCKER_TESTS: "1"
        # `-p no:randomly --strict-markers` is not the point here; `-rs` and the
        # skip assertion below are. This job had no skip census, so if the
        # runner ever lost its Docker CLI every test would skip, pytest would
        # exit 0, and the job would stay green having launched nothing — the
        # exact defect the test job's census exists to prevent, in the one job
        # the census did not cover.
        run: |
          python -m pytest tests/test_container_launch.py tests/test_runtime_image_subject.py -q -rs             --junitxml=container.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("container.xml").getroot()
          cases = suite.iter("testcase")
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          total = len(list(ET.parse("container.xml").getroot().iter("testcase")))
          print(f"container job: {total} collected, {len(skipped)} skipped")
          if skipped:
              print("These must run in this job; a skip here proves nothing:")
              for name in skipped:
                  print(f"  {name}")
              sys.exit(1)
          if total == 0:
              print("no container tests ran at all")
              sys.exit(1)
          PY

  # Asserts the state this repository is actually in before a human approval
  # exists. It deliberately does NOT assert that the governance contracts
  # validate: they cannot, until an accountable human supplies an approval
  # record, and no automated job may manufacture one.
  demo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the evidence binding names the governed subject
          # revision, which is an ancestor of HEAD, and a shallow clone cannot
          # confirm that it is a real commit in this history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[demo,dev]'

      - name: Control contract validates
        run: nornyx check .nornyx/contracts/forge_control.nyx

      - name: Generated BRD contract validates
        run: |
          python - <<'PY'
          from pathlib import Path
          from nornyx_forge.contract_generator import generate_brd_contract
          from nornyx_forge.requirements import parse_brd
          generate_brd_contract(Path.cwd(), parse_brd(Path("BRD.md")))
          PY
          nornyx check .nornyx/generated/brd_contract.nyx

      # Two external authorities are missing, not one: a human approval AND an
      # authenticated independent inspection. This step was named for the
      # approval alone, which is the string a reader sees in the checks UI.
      - name: Governance contracts are blocked only by absent external authority
        run: python scripts/check_pre_approval_baseline.py

      - name: Governance evidence artifacts match their declared digests
        run: python scripts/refresh_governance_evidence.py --verify

      # EVIDENCE-BINDING. The evidence a commit ships must describe the tree that
      # commit contains. Measured on the hardening branch: 130 of 168
      # evidence-bearing commits shipped a binding describing a different tree.
      #
      # PR-scoped with an exact-SHA historical baseline. `origin/main..HEAD`
      # would be permanently red over immutable history, and a permanently red
      # security control is one that gets switched off.
      - name: evidence-binding
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref || 'main' }}"
          python scripts/check_evidence_binding.py "origin/${{ github.base_ref || 'main' }}...HEAD"

      - name: Architecture and security gates
        run: |
          python scripts/check_architecture.py
          python scripts/check_security.py

      - name: Demonstration scenarios run and prevent the high-risk action
        run: nornyx-forge demo --offline

      - name: Application serves and reports governed decisions
        run: python scripts/smoke_http.py

      - run: python -m build

  # The official nornyx.agentic authorization path, the runtime lock, and strict
  # mode only become reachable once a real human approval record exists. Until
  # then this job reports "not applicable" rather than failing, because the
  # absence of approval is the intended state, not a defect.
  strict-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[demo,dev]'

      # NOTE: this detects the APPROVAL only. A contract set that validates
      # outright also needs an authenticated independent inspection, so an
      # approval turning this on is necessary and not sufficient -- the
      # steps below will then fail on the inspection diagnostics rather
      # than pass. That is the correct outcome and not a defect: it is what
      # a second missing authority looks like.
      - name: Detect whether a human approval exists
        id: approval
        run: |
          if python scripts/check_pre_approval_baseline.py --has-approval; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No human approval, so strict authorization is not applicable
        if: steps.approval.outputs.present != 'true'
        run: |
          echo "Governance contracts are not approved."
          echo "Strict Nornyx authorization and the runtime lock stay inactive."

      - name: Governance contracts validate
        if: steps.approval.outputs.present == 'true'
        run: |
          nornyx check .nornyx/contracts/runtime_network.nyx
          nornyx check .nornyx/contracts/architecture_governance.nyx

      - name: Runtime network lock generates and verifies
        if: steps.approval.outputs.present == 'true'
        run: python scripts/prepare_runtime.py

      - name: Strict demonstration uses the official authorization path
        if: steps.approval.outputs.present == 'true'
        run: nornyx-forge demo --offline --strict-nornyx

      - name: Application smoke over the approved head
        if: steps.approval.outputs.present == 'true'
        # No FORGE_SMOKE_STRICT: it was read by the script and used nowhere, so
        # this step and the ordinary smoke were the same run under two names.
        # What proves strict behaviour is the demo and lock steps above, which
        # request the governed backend and fail closed.
        run: python scripts/smoke_http.py
