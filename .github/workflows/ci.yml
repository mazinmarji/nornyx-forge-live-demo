name: ci
on:
  # Branch work is covered by the pull_request event. Listening to bare `push`
  # as well ran the entire workflow twice per commit on the same SHA, which was
  # merely wasteful until container-launch added a real image build to each —
  # then the duplicate runs contended for runners and one of the pair sat
  # unstarted for an hour before being cancelled. Every job still runs on every
  # commit; it runs once.
  push:
    branches: [main]
  pull_request:
  # Hosted runners occasionally drop a queued job, or strand a whole run in
  # `queued` that the API will neither advance nor let you cancel. Without a
  # manual trigger the only way to ask the question again is an empty commit,
  # which puts infrastructure noise into a history that is meant to read as a
  # record of assurance findings.
  workflow_dispatch:

# A superseded run is finished with. Without this, pushing twice in quick
# succession leaves the older run competing with the newer one for the same
# runners, and the answer it eventually gives is about code nobody is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# EVERY `run:` STEP GETS `bash -eo pipefail`.
#
# GitHub's IMPLICIT shell is `bash -e`, which does not set pipefail: in
# `pytest ... | tail -3` the step observes `tail`, so a failing pytest can leave
# a step green. That is not hypothetical here -- a commit in this repository was
# made over a red suite by exactly that pipeline, and the displayed output
# looked fine because the displayed output was never the measured exit state.
#
# Declaring `shell: bash` explicitly is what turns pipefail on.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # EVERY VERSION REPORTS. With fail-fast the first failing
      # interpreter cancels the other three, so a run proves nothing
      # about them -- and the release gate requires 3.10, 3.11, 3.12 and
      # 3.13 each to pass, not one of them to fail first. Measured: 3.11
      # failed and cancelled 3.10, 3.12 and 3.13 mid-run.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, for the reason demo-contract already states:
          # a shallow clone cannot confirm that an ancestor named by the
          # evidence binding is a real commit in this history. The test
          # job carries the anchor and evidence-binding proofs too, and
          # under depth-1 they failed on ALL FOUR interpreters -- 3.12
          # included, which passes locally. Not a version defect; the
          # environment could not answer the question.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The demo extra carries nornyx. Installing only [dev] left every
      # @needs_nornyx test skipping, so a green CI run proved 139 of 202 tests
      # and none of the governance tooling. The job reported success over the
      # controls it was supposed to be guarding.
      - run: python -m pip install -e '.[demo,dev]'
      - run: python scripts/validate_repository.py
      - name: Tests, with no unexpected skips
        run: python scripts/check_test_coverage.py
      - run: python -m compileall -q src scripts

  # A real build and a real launch on a host with a real Docker daemon. The
  # default suite skips this because building downloads packages, which BRD-004
  # forbids for the offline run — but `docker compose config` only parses YAML,
  # so skipping everywhere would leave BRD-005 asserted by nothing.
  container-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'

      - name: Build the image and start the application
        env:
          FORGE_DOCKER_TESTS: "1"
        # `-p no:randomly --strict-markers` is not the point here; `-rs` and the
        # skip assertion below are. This job had no skip census, so if the
        # runner ever lost its Docker CLI every test would skip, pytest would
        # exit 0, and the job would stay green having launched nothing — the
        # exact defect the test job's census exists to prevent, in the one job
        # the census did not cover.
        run: |
          python -m pytest tests/test_container_launch.py tests/test_runtime_image_subject.py -q -rs             --junitxml=container.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("container.xml").getroot()
          cases = suite.iter("testcase")
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          total = len(list(ET.parse("container.xml").getroot().iter("testcase")))
          print(f"container job: {total} collected, {len(skipped)} skipped")
          if skipped:
              print("These must run in this job; a skip here proves nothing:")
              for name in skipped:
                  print(f"  {name}")
              sys.exit(1)
          if total == 0:
              print("no container tests ran at all")
              sys.exit(1)
          PY

  # Asserts the state this repository is actually in before a human approval
  # exists. It deliberately does NOT assert that the governance contracts
  # validate: they cannot, until an accountable human supplies an approval
  # record, and no automated job may manufacture one.
  demo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the evidence binding names the governed subject
          # revision, which is an ancestor of HEAD, and a shallow clone cannot
          # confirm that it is a real commit in this history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[demo,dev]'

      - name: Control contract validates
        run: nornyx check .nornyx/contracts/forge_control.nyx

      - name: Generated BRD contract validates
        run: |
          python - <<'PY'
          from pathlib import Path
          from nornyx_forge.contract_generator import generate_brd_contract
          from nornyx_forge.requirements import parse_brd
          generate_brd_contract(Path.cwd(), parse_brd(Path("BRD.md")))
          PY
          nornyx check .nornyx/generated/brd_contract.nyx

      # Two external authorities are missing, not one: a human approval AND an
      # authenticated independent inspection. This step was named for the
      # approval alone, which is the string a reader sees in the checks UI.
      - name: Governance contracts are blocked only by absent external authority
        run: python scripts/check_pre_approval_baseline.py

      - name: Governance evidence artifacts match their declared digests
        run: python scripts/refresh_governance_evidence.py --verify

      # EVIDENCE-BINDING. The evidence a commit ships must describe the tree that
      # commit contains. Measured on the hardening branch: 130 of 168
      # evidence-bearing commits shipped a binding describing a different tree.
      #
      # PR-scoped with an exact-SHA historical baseline. `origin/main..HEAD`
      # would be permanently red over immutable history, and a permanently red
      # security control is one that gets switched off.
      - name: evidence-binding
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref || 'main' }}"
          python scripts/check_evidence_binding.py "origin/${{ github.base_ref || 'main' }}...HEAD"

      - name: Architecture and security gates
        run: |
          python scripts/check_architecture.py
          python scripts/check_security.py

      - name: Demonstration scenarios run and prevent the high-risk action
        run: nornyx-forge demo --offline

      - name: Application serves and reports governed decisions
        run: python scripts/smoke_http.py

      - run: python -m build

  # The official nornyx.agentic authorization path, the runtime lock, and strict
  # mode only become reachable once a real human approval record exists. Until
  # then this job reports "not applicable" rather than failing, because the
  # absence of approval is the intended state, not a defect.
  strict-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[demo,dev]'

      # NOTE: this detects the APPROVAL only. A contract set that validates
      # outright also needs an authenticated independent inspection, so an
      # approval turning this on is necessary and not sufficient -- the
      # steps below will then fail on the inspection diagnostics rather
      # than pass. That is the correct outcome and not a defect: it is what
      # a second missing authority looks like.
      - name: Detect whether a human approval exists
        id: approval
        run: |
          if python scripts/check_pre_approval_baseline.py --has-approval; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No human approval, so strict authorization is not applicable
        if: steps.approval.outputs.present != 'true'
        run: |
          echo "Governance contracts are not approved."
          echo "Strict Nornyx authorization and the runtime lock stay inactive."

      - name: Governance contracts validate
        if: steps.approval.outputs.present == 'true'
        run: |
          nornyx check .nornyx/contracts/runtime_network.nyx
          nornyx check .nornyx/contracts/architecture_governance.nyx

      - name: Runtime network lock generates and verifies
        if: steps.approval.outputs.present == 'true'
        run: python scripts/prepare_runtime.py

      - name: Strict demonstration uses the official authorization path
        if: steps.approval.outputs.present == 'true'
        run: nornyx-forge demo --offline --strict-nornyx

      - name: Application smoke over the approved head
        if: steps.approval.outputs.present == 'true'
        # No FORGE_SMOKE_STRICT: it was read by the script and used nowhere, so
        # this step and the ordinary smoke were the same run under two names.
        # What proves strict behaviour is the demo and lock steps above, which
        # request the governed backend and fail closed.
        run: python scripts/smoke_http.py

  # THE PERMANENT HOSTILE CORPUS, AS A REMOTE RESULT OF ITS OWN. The closure
  # gate in docs/governance/RELEASE_CONTRACT_V1.md names this job among its
  # remote CI results. What the step runs, what it refuses and what a green run
  # does not establish are stated once, in docs/requirements/ASSUMPTIONS.md
  # under "The hostile-probe job runs every owner and specimen the registries
  # name, and every test in the modules the closure protocol names".
  # tests/test_hostile_probe_job.py holds the job's and the workflow's keys to
  # an exact allowed shape, runs this step against synthetic repositories with
  # a case that must fail for each refusal and one shared case that must pass,
  # and runs it against this tree with pytest intercepted, to pin exactly the
  # test modules it locates.
  hostile-probe:
    runs-on: ubuntu-latest
    # Bounded, as the census bounds its own child: a run that never returns
    # is not a result. The step's own limit on pytest sits below this one, so
    # the step is what reports a timeout.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the corpus includes the evidence-binding escape-hatch
          # guard, which evaluates a range ending at a historical commit.
          fetch-depth: 0
          # Nothing in this job needs the token once the checkout is done.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The demo extra carries nornyx. Without it the corpus's governance
      # guards skip, and a skip fails this job.
      - run: python -m pip install -e '.[demo,dev]'

      - name: The permanent hostile corpus runs, with no skip and no owed identity missing
        run: |
          python - <<'PY'
          import os, re, subprocess, sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          sys.path[:0] = ["tests", "src", "scripts"]
          import attack_classes
          from check_test_coverage import executed_node_ids, node_id
          from test_false_green_audit import INVENTORY

          LIMIT = 2400  # seconds for pytest; below the job's timeout-minutes


          def verdict(reasons):
              print("HOSTILE-PROBE: " + ("FAIL - " + "; ".join(reasons) if reasons else "PASS"),
                    flush=True)
              sys.exit(1 if reasons else 0)


          def section(path, heading):
              """The text under `heading`, up to the next heading of level one or two.

              Inside a code fence or an HTML block a line starting `# ` is not a
              heading, yet it would end the section here and leave the rest of it
              unread. So no line of the section may open either.
              """
              parts = Path(path).read_text(encoding="utf-8").split("\n" + heading + "\n")
              if len(parts) != 2:
                  verdict([f"{path} does not hold exactly one {heading!r} section"])
              text = re.split(r"^#{1,2}(?:[ \t]|$)", parts[1], maxsplit=1, flags=re.M)[0]
              for line in text.splitlines():
                  if re.match(r" {0,3}(?:`{3,}|~{3,}|<)", line):
                      verdict([f"{path} holds a code fence or an HTML block in its "
                               f"{heading!r} section: {line.strip()}"])
              return text


          gate = section("docs/governance/RELEASE_CONTRACT_V1.md", "## The closure gate")
          stated = re.findall(r"Permanent hostile corpus \((\d+) FG \+ (\d+) AC\)", gate)
          if len(stated) != 1 or gate.count("Permanent hostile corpus") != 1:
              verdict(["the closure gate does not state the corpus exactly once as (N FG + M AC)"])
          live = (len(INVENTORY), len(attack_classes.ATTACK_CLASSES))
          if tuple(int(n) for n in stated[0]) != live:
              verdict([f"the closure gate counts {stated[0][0]} FG + {stated[0][1]} AC and "
                       f"the registries hold {live[0]} FG + {live[1]} AC"])

          # The table is the section's first block: every line up to the first
          # blank one. Each of its lines is a row, no line after it in the
          # section may hold a |, and every tests/ path in a row must be a cite
          # the step reads, so no row and no module can leave the table unread.
          corpus = section("docs/governance/CLOSURE_PROTOCOL.md",
                           "## Where the corpus lives").strip().splitlines()
          end = next((n for n, line in enumerate(corpus) if not line.strip()), len(corpus))
          table = corpus[:end]
          if len(table) < 3 or set(table[1]) - set("|-: "):
              verdict(["the closure protocol's corpus section does not open with a table"])
          for line in table:
              if not line.startswith("|"):
                  verdict([f"a line of the corpus table does not start with |: {line.strip()}"])
          for line in corpus[end:]:
              if "|" in line:
                  verdict([f"a line after the corpus table holds |: {line.strip()}"])
          registry = Path(attack_classes.__file__).resolve().relative_to(Path.cwd().resolve())
          located = set()
          for row in table[2:]:
              cited = re.findall(r"`(tests/[^`]*)`", row)
              if not cited:
                  verdict([f"a corpus table row names no module: {row.strip()}"])
              if row.count("tests/") != len(cited):
                  verdict(["a corpus table row names a module in a form the step does not "
                           f"read: {row.strip()}"])
              for path in cited:
                  if not (path.endswith(".py") and Path(path).is_file()):
                      verdict([f"the corpus table cites {path}, which is not a module in this tree"])
                  if Path(path) != registry and not Path(path).name.startswith("test_"):
                      verdict([f"the corpus table cites {path}, which is neither a test "
                               "module nor the registry"])
                  if Path(path) != registry:
                      located.add(path)
          located = sorted(located)
          owed = [(item.ident, item.owner) for item in INVENTORY]
          owed += [(item.ident, node) for item in attack_classes.ATTACK_CLASSES
                   for node in item.specimens]
          if not located:
              verdict(["the corpus table locates no test module"])
          if not owed:
              verdict(["the registries name no owner and no specimen"])
          named = sorted({node for _, node in owed if node.partition("::")[0] not in located})
          print(f"hostile corpus: {live[0]} FG + {live[1]} AC; {len(located)} located modules "
                f"and {len(named)} further named nodes", flush=True)

          # The report goes to RUNNER_TEMP, outside the checkout the corpus inspects.
          if not os.environ.get("RUNNER_TEMP"):
              verdict(["RUNNER_TEMP is not set, so the report has nowhere outside the checkout"])
          report = Path(os.environ["RUNNER_TEMP"]) / "hostile.xml"
          report.unlink(missing_ok=True)
          try:
              completed = subprocess.run(
                  [sys.executable, "-m", "pytest", "-o", "addopts=", "-q", "-rs",
                   "-p", "no:setuponly", "-p", "no:setupplan", f"--junitxml={report}",
                   *located, *named],
                  timeout=LIMIT)
          except subprocess.TimeoutExpired:
              verdict([f"pytest did not finish within {LIMIT} s"])
          if not report.exists():
              verdict([f"pytest exited {completed.returncode} and wrote no report"])
          root = ET.parse(report).getroot()
          cases = list(root.iter("testcase"))
          outcomes = sum(int(suite.get("tests", -1)) for suite in root.iter("testsuite"))
          skipped = [node_id(case) for case in cases if case.find("skipped") is not None]
          # The report decides, not the exit code alone: a hook in the commit under
          # test can rewrite pytest's exit status to zero, and the report still
          # holds each failure and error, as an element and in its suite's counts.
          failures = len(list(root.iter("failure")))
          errors = len(list(root.iter("error")))
          unclean = [f"{suite.get('failures')} failures and {suite.get('errors')} errors"
                     for suite in root.iter("testsuite")
                     if (suite.get("failures"), suite.get("errors")) != ("0", "0")]
          broken = sorted({node_id(case) for case in cases
                           if case.find("failure") is not None or case.find("error") is not None})
          executed = executed_node_ids(report)
          owed_nodes = {node for _, node in owed}
          missing = sorted(f"{ident} {node}" for ident, node in owed if node not in executed)
          silent = [module for module in located
                    if not any(found.startswith(module + "::") for found in executed)]
          print(f"hostile-probe: {len(cases)} testcases, {outcomes} outcomes recorded, "
                f"{len(skipped)} skipped, {failures} failure and {errors} error elements; "
                f"owed identities not executed {len(owed_nodes - executed)} of "
                f"{len(owed_nodes)}; located modules that executed nothing {len(silent)} "
                f"of {len(located)}")
          listed = sorted(set(skipped)) + [f"not passed {name}" for name in broken] + missing
          for line in listed + [f"module {name}" for name in silent]:
              print(f"  {line}")
          reasons = []
          if completed.returncode:
              reasons.append(f"pytest exited {completed.returncode}")
          if outcomes != len(cases):
              reasons.append(f"the report lists {len(cases)} testcases and records "
                             f"{outcomes} outcomes")
          if skipped:
              reasons.append(f"{len(skipped)} skipped testcases")
          if failures:
              reasons.append(f"{failures} <failure> elements in the report")
          if errors:
              reasons.append(f"{errors} <error> elements in the report")
          if unclean:
              reasons.append("a testsuite counts " + ", ".join(unclean))
          if missing:
              reasons.append(f"{len(owed_nodes - executed)} owed identities not executed")
          if silent:
              reasons.append(f"{len(silent)} located modules executed nothing")
          verdict(reasons)
          PY

  # PR-18: the Windows basic-user runtime, on a Windows host. RUNTIME
  # VALIDATION ONLY -- no release publication, no installer, no signing, no
  # MSI, no ForgeSetup.exe; those belong to the later distribution tranche
  # (A-020). The Linux census declares the Windows-hosted tests' skips by
  # identity; this job is where they execute, and a skip HERE fails the job
  # -- the container-launch census applied again -- because a Windows job
  # that skipped every Windows test would be green over nothing. The
  # interpreter is the runner's installed CPython, i.e. the developer-bundle
  # arrangement. No step of this job downloads the embeddable interpreter;
  # the windows-payload job fetches the pinned archive (A-017's amendment)
  # and never runs it, so the embedded-interpreter smoke stays operator
  # evidence.
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[demo,dev]'

      # `tests/test_provider_execution.py` is here because the CHANGELOG said
      # it was and it was not (round-6 test T-P3-2). What that suite pins on
      # this host is `_provider_env()`'s stripping, read back from the
      # environment a REAL child process received; the environment a child
      # inherits is a platform property, and asserting it only on Linux left
      # the Windows behaviour asserted by nothing. It is hermetic -- fake
      # executables, no network, no provider CLI -- so it adds no skip.
      # tests/test_control_plane_authority.py joins this job for Tranche C: its
      # wire census and its self-probe are Windows-relevant, and the OpenProcess
      # VM-read observation only becomes `observed` here -- in the cross-process
      # witness (the CLI in a child process); the in-process self-probe is
      # not_applicable on its own pid everywhere, and the whole module degrades
      # to not_applicable off Windows, so it adds no skip on any host.
      # tests/test_standing_obligations_windows.py joins for the standing-
      # obligation checker: a directory junction is a plain directory to
      # `Path.is_symlink()`, so the overlay confinement it pins -- junctions
      # refused wherever they sit, a `\\?\` spelling still the repository,
      # a plain external overlay admitted -- is observable only here. Junctions
      # need no privilege, so nothing in it skips on this host; off Windows
      # every test in it is a declared skip in the census.
      - name: Windows runtime, bundle builder, launch, provider and control-plane tests, with no skips
        run: |
          python -m pytest tests/test_windows_host_runtime.py tests/test_windows_runtime.py tests/test_windows_bundle.py tests/test_onboarding_launch.py tests/test_provider_execution.py tests/test_control_plane_authority.py tests/test_standing_obligations_windows.py -q -rs --junitxml=windows.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse("windows.xml").getroot().iter("testcase"))
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          print(f"windows job: {len(cases)} collected, {len(skipped)} skipped")
          if skipped:
              print("These must run in this job; a skip here proves nothing:")
              for name in skipped:
                  print(f"  {name}")
              sys.exit(1)
          if len(cases) < 277:
              print("the windows job collected fewer than 277 tests. Its seven modules "
                    "carry 283 here (7/14/15/23/54/73/97), so this floor is 283 - 7 + 1, "
                    "one above what is left when the SMALLEST module -- 7 tests, "
                    "tests/test_standing_obligations_windows.py -- stops running: below it, at "
                    "least one WHOLE module is no longer running in this job. The old "
                    "floor of 60 is clear of any FIVE of these seven -- the five "
                    "smallest carry 113 -- so two whole modules could vanish beneath "
                    "it. These numbers are not maintained by hand: "
                    "test_the_windows_job_floor_is_the_arithmetic_it_states collects "
                    "the modules this command names and holds the floor, and this "
                    "sentence, to what it measures.")
              sys.exit(1)
          PY

  # The Windows payload, built TWICE and compared byte for byte: the
  # manifests, every file (`diff -r`), and every path, type and modification
  # time (the listings; they carry no size, because a directory's size is its
  # file system's bookkeeping and every file's size is already compared). A
  # difference fails the job. The second build varies what must NOT reach the
  # bytes: another checkout path, another interpreter path (a venv), a warm uv
  # cache holding a changed file, and ambient `UV_COMPILE_BYTECODE`,
  # `UV_CACHE_DIR` and `UV_INDEX_URL` variables. uv is installed from a hashed
  # requirement at the pinned version, and the interpreter archive is fetched
  # HERE, by the pinned URL, and refused unless it has the pinned SHA-256 (the
  # builder checks it again and downloads nothing itself). The runner is named
  # by its image label, which GitHub updates; the actions are pinned by
  # commit. Both builds run on one runner, so this shows that the build is a
  # function of its pinned inputs on this image, not that a second machine
  # agrees. It builds no installer, publishes nothing and uploads no
  # artifact. The payload's interpreter is not run here (Linux), and no CI job
  # runs it yet.
  windows-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: first
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: second
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install the pinned installer
        run: python -m pip install --require-hashes --no-deps -r first/scripts/windows_installer/build-tools.txt
      - name: Fetch the pinned interpreter archive
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request
          pins = json.load(open("first/scripts/windows_installer/pins.json", encoding="utf-8"))
          archive = pins["interpreter"]
          with urllib.request.urlopen(archive["archive_url"], timeout=120) as response:
              data = response.read()
          with open(os.path.join(os.environ["RUNNER_TEMP"], "python-embed.zip"), "wb") as handle:
              handle.write(data)
          digest = hashlib.sha256(data).hexdigest()
          print(f"{archive['archive_url']}: sha256 {digest}")
          if digest != archive["archive_sha256"]:
              raise SystemExit(f"not the pinned archive: expected {archive['archive_sha256']}")
          PY
      - name: Build the payload from the first checkout
        run: |
          sha=$(python -c "import json; print(json.load(open('first/scripts/windows_installer/pins.json', encoding='utf-8'))['interpreter']['archive_sha256'])")
          python first/scripts/build_windows_bundle.py --dist "$RUNNER_TEMP/payload-first" \
            --python-embed "$RUNNER_TEMP/python-embed.zip" --python-embed-sha256 "$sha"
      - name: Build it again from the second checkout, varying what must not matter
        run: |
          python -m venv "$RUNNER_TEMP/second-python"
          UV_CACHE_DIR="$RUNNER_TEMP/warm-cache" uv pip install --no-config --quiet \
            --target "$RUNNER_TEMP/warm-target" --python-platform x86_64-pc-windows-msvc \
            --python-version 3.13 --only-binary :all: --require-hashes \
            -r second/scripts/windows_installer/pylib-cp313-win_amd64.txt
          changed=$(find "$RUNNER_TEMP/warm-cache" -name six.py -print -quit)
          test -n "$changed"
          printf '\n# changed in the cache, which the build must not read\n' >> "$changed"
          sha=$(python -c "import json; print(json.load(open('second/scripts/windows_installer/pins.json', encoding='utf-8'))['interpreter']['archive_sha256'])")
          UV_CACHE_DIR="$RUNNER_TEMP/warm-cache" UV_COMPILE_BYTECODE=1 \
            UV_INDEX_URL=https://example.invalid/simple \
            "$RUNNER_TEMP/second-python/bin/python" second/scripts/build_windows_bundle.py \
            --dist "$RUNNER_TEMP/payload-second" \
            --python-embed "$RUNNER_TEMP/python-embed.zip" --python-embed-sha256 "$sha"
      - name: Compare the two payloads byte for byte
        run: |
          cd "$RUNNER_TEMP"
          cmp payload-first/forge-payload.json payload-second/forge-payload.json
          diff -r --no-dereference payload-first payload-second
          (cd payload-first && find . -printf '%P %y %T@\n' | LC_ALL=C sort) > first.list
          (cd payload-second && find . -printf '%P %y %T@\n' | LC_ALL=C sort) > second.list
          cmp first.list second.list
          PYTHONPATH="$GITHUB_WORKSPACE/first/src" python -m nornyx_forge.windows_payload verify payload-first
          PYTHONPATH="$GITHUB_WORKSPACE/second/src" python -m nornyx_forge.windows_payload verify payload-second
          python -c "import json; m = json.load(open('payload-first/forge-payload.json')); print('payload', m['payload_sha256'], len(m['files']), 'files', sum(f[1] for f in m['files']), 'bytes')"

  # THE INSTALLER COMPILER, BUILT FROM PINNED SOURCE TWICE AND COMPARED.
  # NSIS 3.13 is built from the upstream source archive pinned in
  # scripts/windows_installer/nsis-toolchain.json (size, SHA-256 and MD5). That
  # is a trust-on-first-use pin, not authenticated upstream provenance: no
  # upstream cryptographic release signature is available to Forge (A-042). The
  # build runs inside the Ubuntu image pinned by digest, with no network, over
  # the packages pinned by size and SHA-256 in nsis-build-debs.json; these jobs
  # never refresh package lists, read no cache and have no secret. Each matrix
  # leg is a separate runner building from the same pins, and
  # nsis-toolchain-verify compares them byte for byte and against the pinned
  # outputs: it fails, printing what it measured, on any difference. Equal bytes from two runners on one image and one package set show
  # that the output is a function of its pinned inputs; they do not show that
  # another distribution agrees.
  nsis-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        leg: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check the pins
        run: python scripts/windows_installer/build_nsis_toolchain.py check
      - name: Fetch and verify the source and the build packages
        run: python scripts/windows_installer/build_nsis_toolchain.py fetch --work "$RUNNER_TEMP/nsis-work"
      - name: Pull the pinned image
        run: docker pull "$(python -c "import json; print(json.load(open('scripts/windows_installer/nsis-toolchain.json', encoding='utf-8'))['container']['image'])")"
      - name: Build NSIS in the container, with no network
        run: python scripts/windows_installer/build_nsis_toolchain.py build --work "$RUNNER_TEMP/nsis-work" --out "$RUNNER_TEMP/nsis-out"
      - name: Copy the output to a folder this job owns, and describe it
        run: python scripts/windows_installer/build_nsis_toolchain.py describe --from "$RUNNER_TEMP/nsis-out" --to "$RUNNER_TEMP/nsis-artifact"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nsis-toolchain-${{ matrix.leg }}
          path: ${{ runner.temp }}/nsis-artifact
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  nsis-toolchain-verify:
    needs: nsis-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nsis-toolchain-a
          path: ${{ runner.temp }}/leg-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nsis-toolchain-b
          path: ${{ runner.temp }}/leg-b
      - name: Compare the two builds, and both with the pinned outputs
        run: python scripts/windows_installer/build_nsis_toolchain.py verify --a "$RUNNER_TEMP/leg-a" --b "$RUNNER_TEMP/leg-b"

  # A small installer compiled with the built compiler, run on a Windows host.
  # It shows that the cross-compiled stub and the System and nsExec plug-ins
  # run: the process token is read, a child's exit code and output come back,
  # the manifest asks for no privilege, and an elevated run (the runner's own
  # administrator account) takes the refusal path. The compiler tree is checked
  # against the pinned outputs when they are pinned, before anything in it is
  # run; this job runs on the first leg's output whether or not the verify job
  # has passed, and can show only that the stubs run, never that the toolchain
  # is accepted.
  nsis-smoke-build:
    needs: nsis-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nsis-toolchain-a
          path: ${{ runner.temp }}/leg-a
      # The tree must be the one the pinned outputs name before the compiler in it
      # is started. If the outputs were ever null again, check-tree would refuse
      # until this step said `--allow-unpinned` in so many words, and a test would
      # require that.
      - name: Refuse a compiler tree that contradicts the pins
        run: python scripts/windows_installer/build_nsis_toolchain.py check-tree --tree "$RUNNER_TEMP/leg-a/nsis"
      - name: Pull the pinned image
        run: docker pull "$(python -c "import json; print(json.load(open('scripts/windows_installer/nsis-toolchain.json', encoding='utf-8'))['container']['image'])")"
      - name: Compile the smoke installer, in the pinned image with no network
        run: |
          chmod +x "$RUNNER_TEMP/leg-a/nsis/Bin/makensis"
          python scripts/windows_installer/build_nsis_toolchain.py compile-smoke --tree "$RUNNER_TEMP/leg-a/nsis" --out "$RUNNER_TEMP/smoke/nsis-smoke.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nsis-smoke
          path: ${{ runner.temp }}/smoke
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  nsis-smoke-windows:
    needs: nsis-smoke-build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nsis-smoke
          path: ${{ runner.temp }}/smoke
      - name: Run the smoke installer as the runner's administrator
        run: python scripts/windows_installer/build_nsis_toolchain.py run-smoke --exe "$RUNNER_TEMP/smoke/nsis-smoke.exe" --work "$RUNNER_TEMP/smoke-run" --expect elevated

  # The source pin is checked against the live upstream tag and SourceForge's
  # listing only when this job runs, and it runs only when someone dispatches the
  # workflow: a moved tag or a changed listing is otherwise not noticed by CI. It
  # fails if the tag no longer names the pinned commit and tree, if SourceForge no
  # longer lists the pinned size and MD5, or if the archive no longer compares to
  # the tagged tree as pinned (A-042).
  nsis-source-corroboration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Compare the pinned source with the upstream tag and the published listing
        run: python scripts/windows_installer/build_nsis_toolchain.py against-tag
