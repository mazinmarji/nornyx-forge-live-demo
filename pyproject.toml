[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nornyx-forge-live-demo"
version = "0.2.0"
description = "One-prompt, Nornyx-governed software delivery demo using Claude Code and CrewAI Flows."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Mazin Marji and Nornyx Forge contributors"}]
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.8,<3",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
demo = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "crewai==1.15.4",
  "nornyx==1.11.0",
  "nornyx-agentic-adapters[crewai]==0.2.0",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.16,<0.17",
  "build>=1.2,<2",
]

[project.scripts]
nornyx-forge = "nornyx_forge.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nornyx_forge*", "demo_app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
demo_app = ["static/*"]
